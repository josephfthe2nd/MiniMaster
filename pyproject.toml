[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimaster"
version = "0.1.0"
description = "Design, rig, pose, and export 3D-printable tabletop miniatures (low-poly modeler + rigging studio)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.scripts]
minimaster = "minimaster.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["minimaster*"]

[tool.setuptools.package-data]
minimaster = ["templates/*.mmp", "parts/*.mmpart", "parts/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
